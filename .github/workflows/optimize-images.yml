# Automatically resizes (max 1920px wide) and compresses any image pushed to
# assets/images, then commits the smaller files back. Nothing to run yourself.
name: Optimize images

on:
  push:
    branches: [main]
    paths: ["assets/images/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 scripts/optimize_images.py
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images scripts/.optimized-images.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Optimize images"
            git push
          fi
