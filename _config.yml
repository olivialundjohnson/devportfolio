# ---------------------------------------------------------------------------
# Site settings. GitHub Pages rebuilds the site on every push.
# ---------------------------------------------------------------------------

title: Olivia Johnson
descriptor: Creative / Energy / Storytelling
description: >-
  I like big ideas and making them happen. Film, energy, climate & everything in between.
footer_line: Creative work. Complex ideas. Real-world systems.

# For a custom domain or <username>.github.io repo, leave baseurl empty.
# For a project repo (github.com/<username>/portfolio), use baseurl: "/portfolio".
url: "https://oliviajohnson.com"
baseurl: ""

author:
  name: Olivia Johnson
  email: olivia@lundjohnson.com
  linkedin: https://www.linkedin.com/in/olivialundjohnson/

# Fallback image for link previews (social cards).
image: /assets/images/about/portrait.jpg

nav:
  - title: Work
    url: /work/
  - title: About
    url: /about/
  - title: Contact
    url: /contact/

# The four areas of work (homepage tiles). Order here = order on the homepage and Work page.
# `key` must match the `category:` set in each project file.
areas:
  - key: projects
    title: Projects
    subtitle: Documentary · Narrative · Wildlife
    url: /projects/
    image: /assets/images/home/projects.jpg
    image_alt: "[TODO: describe the Projects tile image]"
  - key: writing
    title: Writing & Ideas
    subtitle: Fiction · Climate · Speculation
    url: /writing/
    image: /assets/images/home/writing.jpg
    image_alt: "[TODO: describe the Writing & Ideas tile image]"
  - key: energy
    title: Energy & Climate
    subtitle: Research · Policy · Communications
    url: /energy/
    image: /assets/images/home/energy.jpg
    image_alt: "[TODO: describe the Energy & Climate tile image]"
  - key: audio
    title: Audio & Storytelling
    subtitle: Ground Truth · Fervo Energy
    url: /audio/
    image: /assets/images/home/audio.jpg
    image_alt: "[TODO: describe the Audio & Storytelling tile image]"

# ---------------------------------------------------------------------------
# Build settings — you shouldn't need to change anything below this line.
# ---------------------------------------------------------------------------

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

collections:
  projects:
    output: true
    permalink: /work/:name/

defaults:
  - scope: { path: "", type: projects }
    values: { layout: project }
  - scope: { path: "" }
    values: { layout: page }

theme: null

# Only plugins on the GitHub Pages allow-list.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
  - .github/
