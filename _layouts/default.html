<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#161616">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap">
  {%- if page.uses_video %}
  <link rel="stylesheet" href="{{ '/assets/vendor/lite-youtube-embed/lite-yt-embed.css' | relative_url }}">
  {%- endif %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" tabindex="-1">
    {{ content }}
  </main>
  {% include footer.html %}
  {%- if page.uses_video %}
  <script src="{{ '/assets/vendor/lite-youtube-embed/lite-yt-embed.js' | relative_url }}" defer></script>
  {%- endif %}
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
